<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAO Academy – Integrated Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.hidden{display:none!important}.center{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login{width:420px;padding:30px;text-align:center}.card{background:#fff;border-radius:14px;box-shadow:0 4px 18px #00000012;padding:20px}
.login img{width:90px;height:90px;object-fit:contain}.login h1{margin:8px 0}.login input,.login select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5e2;border-radius:8px}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;background:#1769aa;color:#fff;margin:3px}button.secondary{background:#64748b}button.danger{background:#c62828}
header{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px #00000012;position:sticky;top:0;z-index:5}
header img{width:52px;height:52px;object-fit:contain}header>div{flex:1}header small{display:block;color:#64748b;margin-top:3px}
nav{background:#0f3d63;padding:9px 15px;display:flex;gap:5px;flex-wrap:wrap}nav button{background:transparent;margin:0;border-radius:6px}nav button:hover,nav button.active{background:#ffffff22}
main{max-width:1250px;margin:24px auto;padding:0 18px}footer{text-align:center;color:#64748b;padding:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:15px 0}.stat{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 15px #0000000d}.stat strong{display:block;font-size:30px;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccd5e2;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 15px #0000000d;margin-top:14px}th,td{padding:11px;border-bottom:1px solid #e8edf3;text-align:left}th{background:#eaf2f8}
.notice{padding:13px;background:#e8f3ff;border-left:4px solid #1769aa;border-radius:6px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9eef5;font-size:12px}.pass{color:#137333;font-weight:bold}.fail{color:#c62828;font-weight:bold}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.formgrid input,.formgrid select{width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:8px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20}.modal .card{width:min(650px,94vw);max-height:90vh;overflow:auto}
.small{font-size:12px;color:#64748b}.right{text-align:right}
</style>
</head>
<body>
<div id="login" class="center">
  <div class="card login">
    <img id="loginLogo">
    <h1>VAO Academy</h1>
    <p>Smart Learning, Smart Results</p>
    <select id="loginRole"><option value="admin">School Admin</option><option value="teacher">Teacher</option></select>
    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <p class="small">Demo Admin: <b>admin</b> / <b>admin123</b><br>Demo Teacher: <b>teacher1</b> / <b>teacher123</b></p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <img id="brandLogo">
  <div><b id="schoolTitle"></b><small id="userTitle"></small></div>
  <button class="secondary" onclick="logout()">Logout</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Powered by VAO Academy • <span id="footerSchool"></span></footer>
</div>
<div id="modal"></div>

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function byId(arr,id){return arr.find(x=>x.id===id)}
function cls(id){let x=byId(data.classes,id);return x?x.name+(x.stream?" "+x.stream:""):""}
function grade(x){return x>=75?"A":x>=60?"B":x>=50?"C":x>=40?"D":"F"}
function remark(x){return x>=50?"PASS":"FAIL"}

function login(){
 const role=document.getElementById("loginRole").value,u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value;
 if(role==="admin"&&u===data.users.admin.user&&p===data.users.admin.pass) session={role,user:u};
 else if(role==="teacher"&&data.teachers.some(t=>t.user===u&&t.pass===p)) session={role,user:u};
 else return alert("Username or password is not correct.");
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 renderNav(); go(session.role==="admin"?"dashboard":"tdashboard");
}
function logout(){location.reload()}
function me(){return data.teachers.find(t=>t.user===session.user)}

const adminPages=[
 ["dashboard","Dashboard"],["profile","School Profile"],["teachers","Teachers"],["students","Students"],
 ["classes","Classes"],["subjects","Subjects"],["assignments","Teacher Assignments"],
 ["assessments","All Assessments"],["results","School Results"],["reportcards","Report Cards"],
 ["compare","Compare Results"],["backup","Backup / Restore"]
];
const teacherPages=[
 ["tdashboard","My Dashboard"],["tclasses","My Classes"],["tsubjects","My Subjects"],
 ["tstudents","My Students"],["enter","Enter Assessment"],["tresults","My Results"]
];
function renderNav(){
 const pages=session.role==="admin"?adminPages:teacherPages;
 document.getElementById("nav").innerHTML=pages.map(([id,label])=>`<button id="nav_${id}" onclick="go('${id}')">${label}</button>`).join("");
 document.getElementById("schoolTitle").textContent=data.school.name;
 document.getElementById("footerSchool").textContent=data.school.name;
 document.getElementById("userTitle").textContent=session.role==="admin"?"School Admin":"Teacher: "+me().name;
}
function go(id){
 active=id;
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 const nb=document.getElementById("nav_"+id); if(nb)nb.classList.add("active");
 const pages={
 dashboard,profile,teachers,students,classes,subjects,assignments,assessments,results,reportcards,compare,backup,
 tdashboard,tclasses,tsubjects,tstudents,enter,tresults
 };
 document.getElementById("main").innerHTML=pages[id]();
}

function dashboard(){
 return `<h2>${esc(data.school.name)}</h2>
 <div class="grid">
 <div class="stat">Teachers<strong>${data.teachers.length}</strong></div>
 <div class="stat">Students<strong>${data.students.length}</strong></div>
 <div class="stat">Classes<strong>${data.classes.length}</strong></div>
 <div class="stat">Subjects<strong>${data.subjects.length}</strong></div>
 <div class="stat">Assessments<strong>${data.assessments.length}</strong></div>
 </div>
 <div class="notice">All school modules are connected in this integrated prototype. The final online version will replace browser storage with a hosted database and server-side school isolation.</div>`;
}
function profile(){
 return `<h2>School Profile</h2><div class="card"><div class="formgrid">
 <label>School Name<input id="pname" value="${esc(data.school.name)}"></label>
 <label>School Code<input id="pcode" value="${esc(data.school.code)}"></label>
 <label>Academic Year<input id="pyear" value="${esc(data.school.year)}"></label>
 <label>Current Term<select id="pterm">${["Term 1","Term 2","Term 3"].map(x=>`<option ${x===data.school.term?"selected":""}>${x}</option>`).join("")}</select></label>
 </div><button onclick="saveProfile()">SAVE PROFILE</button></div>`;
}
function saveProfile(){data.school={name:document.getElementById("pname").value.trim()||data.school.name,code:document.getElementById("pcode").value.trim(),year:document.getElementById("pyear").value.trim(),term:document.getElementById("pterm").value};save();renderNav();go("profile")}

function teachers(){
 return `<h2>Teachers</h2><div class="toolbar">
 <input id="tn" placeholder="Full name"><input id="tu" placeholder="Username"><input id="tp" placeholder="Password">
 <button onclick="addTeacher()">ADD TEACHER</button></div>
 ${table(["Name","Username","Assignments","Action"],data.teachers.map(t=>[
 esc(t.name),esc(t.user),data.assignments.filter(a=>a.teacherId===t.id).length,
 `<button class="danger" onclick="deleteTeacher('${t.id}')">DELETE</button>`
 ]))}`;
}
function addTeacher(){
 let n=tn.value.trim(),u=tu.value.trim(),p=tp.value;
 if(!n||!u||!p)return alert("Fill all teacher fields.");
 if(data.teachers.some(t=>t.user===u))return alert("Username already exists.");
 data.teachers.push({id:uid("t"),name:n,user:u,pass:p});save();go("teachers");
}
function deleteTeacher(id){if(!confirm("Delete this teacher?"))return;data.teachers=data.teachers.filter(t=>t.id!==id);data.assignments=data.assignments.filter(a=>a.teacherId!==id);save();go("teachers")}

function students(){
 return `<h2>Students</h2><div class="toolbar">
 <input id="sn" placeholder="Student full name"><input id="sa" placeholder="Admission No.">
 <select id="sc">${data.classes.map(c=>`<option value="${c.id}">${esc(cls(c.id))}</option>`).join("")}</select>
 <button onclick="addStudent()">ADD STUDENT</button></div>
 ${table(["Admission","Student","Class","Action"],data.students.map(s=>[
 esc(s.admission),esc(s.name),esc(cls(s.classId)),
 `<button class="danger" onclick="deleteStudent('${s.id}')">DELETE</button>`
 ]))}`;
}
function addStudent(){let n=sn.value.trim();if(!n)return alert("Enter student name.");data.students.push({id:uid("st"),name:n,admission:sa.value.trim(),classId:sc.value});save();go("students")}
function deleteStudent(id){if(!confirm("Delete this student and their assessments?"))return;data.students=data.students.filter(s=>s.id!==id);data.assessments=data.assessments.filter(a=>a.studentId!==id);save();go("students")}

function classes(){
 return `<h2>Classes</h2><div class="toolbar"><input id="cn" placeholder="Grade 6"><input id="cs" placeholder="Stream A"><button onclick="addClass()">ADD CLASS</button></div>
 ${table(["Class","Stream","Students"],data.classes.map(c=>[esc(c.name),esc(c.stream||""),data.students.filter(s=>s.classId===c.id).length]))}`;
}
function addClass(){let n=cn.value.trim();if(!n)return;data.classes.push({id:uid("c"),name:n,stream:cs.value.trim()});save();go("classes")}

function subjects(){
 return `<h2>Subjects</h2><div class="toolbar"><input id="subn" placeholder="Subject name"><button onclick="addSubject()">ADD SUBJECT</button></div>
 ${table(["Subject","Teachers Assigned"],data.subjects.map(s=>[esc(s.name),data.assignments.filter(a=>a.subjectId===s.id).length]))}`;
}
function addSubject(){let n=subn.value.trim();if(!n)return;if(data.subjects.some(s=>s.name.toLowerCase()===n.toLowerCase()))return alert("Subject already exists.");data.subjects.push({id:uid("s"),name:n});save();go("subjects")}

function assignments(){
 return `<h2>Teacher → Subject → Class</h2>
 <div class="card"><div class="formgrid">
 <label>Teacher<select id="at">${data.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
 <label>Subject<select id="as">${data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label>
 <label>Class<select id="ac">${data.classes.map(c=>`<option value="${c.id}">${esc(cls(c.id))}</option>`).join("")}</select></label>
 </div><button onclick="addAssignment()">ASSIGN</button></div>
 ${table(["Teacher","Subject","Class","Action"],data.assignments.map(a=>{
 let t=byId(data.teachers,a.teacherId),s=byId(data.subjects,a.subjectId);return [esc(t?.name),esc(s?.name),esc(cls(a.classId)),`<button class="danger" onclick="removeAssignment('${a.teacherId}','${a.subjectId}','${a.classId}')">REMOVE</button>`]
 }))}`;
}
function addAssignment(){
 if(!data.assignments.some(a=>a.teacherId===at.value&&a.subjectId===as.value&&a.classId===ac.value))
   data.assignments.push({teacherId:at.value,subjectId:as.value,classId:ac.value});
 save();go("assignments");
}
function removeAssignment(t,s,c){data.assignments=data.assignments.filter(a=>!(a.teacherId===t&&a.subjectId===s&&a.classId===c));save();go("assignments")}

function assessmentRows(arr){
 return arr.map(a=>[esc(byId(data.students,a.studentId)?.name||a.student),esc(a.teacherName),esc(a.subjectName),esc(a.className),esc(a.term),a.formative,a.summative,a.final,a.grade,`<span class="${a.remark==="PASS"?"pass":"fail"}">${a.remark}</span>`]);
}
function assessments(){return `<h2>All Assessments</h2>${table(["Student","Teacher","Subject","Class","Term","Formative /40","Summative /60","Final /100","Grade","Remark"],assessmentRows(data.assessments))}`}
function results(){
 return `<h2>School Results</h2><p class="small">Results from all teachers are combined here.</p>
 ${table(["Student","Teacher","Subject","Class","Term","Formative /40","Summative /60","Final /100","Grade","Remark"],assessmentRows(data.assessments))}`;
}

function reportcards(){
 let ids=[...new Set(data.assessments.map(a=>a.studentId))];
 return `<h2>Report Cards</h2><div class="toolbar"><select id="rcStudent"><option value="">Select student</option>${data.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><button onclick="showReportCard()">VIEW REPORT CARD</button></div><div id="reportArea"></div>`;
}
function showReportCard(){
 let s=byId(data.students,rcStudent.value);if(!s)return alert("Select a student.");
 let rows=data.assessments.filter(a=>a.studentId===s.id);
 let avg=rows.length?rows.reduce((x,a)=>x+a.final,0)/rows.length:0;
 document.getElementById("reportArea").innerHTML=`<div class="card"><h3>${esc(data.school.name)}</h3><p><b>Student:</b> ${esc(s.name)} &nbsp; <b>Class:</b> ${esc(cls(s.classId))}</p>
 ${table(["Subject","Formative","Summative","Final","Grade","Remark"],rows.map(a=>[esc(a.subjectName),a.formative,a.summative,a.final,a.grade,`<span class="${a.remark==="PASS"?"pass":"fail"}">${a.remark}</span>`]))}
 <p><b>Average:</b> ${avg.toFixed(2)} / 100</p></div>`;
}

function compare(){
 return `<h2>Compare Results</h2><div class="card"><div class="formgrid">
 <label>Student<select id="cmpStudent">${data.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label>
 <label>Subject<select id="cmpSubject">${data.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label>
 <label>First Term<select id="cmpT1"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label>
 <label>Second Term<select id="cmpT2"><option>Term 2</option><option>Term 3</option><option>Term 1</option></select></label>
 </div><button onclick="doCompare()">COMPARE</button></div><div id="compareArea"></div>`;
}
function doCompare(){
 let rows=data.assessments.filter(a=>a.studentId===cmpStudent.value&&a.subjectId===cmpSubject.value);
 let a=rows.find(x=>x.term===cmpT1.value),b=rows.find(x=>x.term===cmpT2.value);
 if(!a||!b)return document.getElementById("compareArea").innerHTML=`<div class="notice">Both selected assessments are required for comparison.</div>`;
 let diff=b.final-a.final;
 document.getElementById("compareArea").innerHTML=`<div class="card"><h3>${esc(byId(data.students,cmpStudent.value)?.name)} – ${esc(byId(data.subjects,cmpSubject.value)?.name)}</h3>
 <p>${esc(a.term)}: <b>${a.final}</b> &nbsp; | &nbsp; ${esc(b.term)}: <b>${b.final}</b> &nbsp; | &nbsp; Change: <b>${diff>0?"+":""}${diff}</b></p></div>`;
}

function tdashboard(){
 let t=me(),aa=data.assignments.filter(a=>a.teacherId===t.id);
 return `<h2>Teacher Dashboard</h2><div class="grid">
 <div class="stat">My Subjects<strong>${new Set(aa.map(a=>a.subjectId)).size}</strong></div>
 <div class="stat">My Classes<strong>${new Set(aa.map(a=>a.classId)).size}</strong></div>
 <div class="stat">My Students<strong>${data.students.filter(s=>aa.some(a=>a.classId===s.classId)).length}</strong></div>
 <div class="stat">My Assessments<strong>${data.assessments.filter(a=>a.teacherId===t.id).length}</strong></div>
 </div><div class="notice">You can enter marks only for your assigned subject/class combinations.</div>`;
}
function tclasses(){let t=me(),aa=data.assignments.filter(a=>a.teacherId===t.id);return `<h2>My Classes</h2>${table(["Class"],[...new Set(aa.map(a=>a.classId))].map(id=>[esc(cls(id))]))}`}
function tsubjects(){let t=me(),aa=data.assignments.filter(a=>a.teacherId===t.id);return `<h2>My Subjects</h2>${table(["Subject"],[...new Set(aa.map(a=>a.subjectId))].map(id=>[esc(byId(data.subjects,id)?.name)]))}`}
function tstudents(){let t=me(),aa=data.assignments.filter(a=>a.teacherId===t.id);return `<h2>My Students</h2>${table(["Student","Class"],data.students.filter(s=>aa.some(a=>a.classId===s.classId)).map(s=>[esc(s.name),esc(cls(s.classId))]))}`}

function enter(){
 let t=me(),aa=data.assignments.filter(a=>a.teacherId===t.id);
 if(!aa.length)return `<h2>Enter Assessment</h2><div class="notice">No subject/class has been assigned to your account yet.</div>`;
 return `<h2>Enter Assessment</h2><div class="card"><div class="formgrid">
 <label>Subject<select id="es" onchange="refreshEntry()">${aa.map(a=>`<option value="${a.subjectId}|${a.classId}">${esc(byId(data.subjects,a.subjectId)?.name)} – ${esc(cls(a.classId))}</option>`).join("")}</select></label>
 <label>Term<select id="et"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label>
 </div></div><div id="entryList"></div><script>setTimeout(refreshEntry,0)<\/script>`;
}
function refreshEntry(){
 let [sid,cid]=es.value.split("|"),students=data.students.filter(s=>s.classId===cid);
 document.getElementById("entryList").innerHTML=students.map((s,i)=>`<div class="card" style="margin-top:10px"><b>${esc(s.name)}</b>
 <div class="formgrid"><input id="cw_${s.id}" type="number" min="0" max="10" placeholder="Classwork /10"><input id="hw_${s.id}" type="number" min="0" max="10" placeholder="Homework /10"><input id="qt_${s.id}" type="number" min="0" max="10" placeholder="Quiz/Test /10"><input id="as_${s.id}" type="number" min="0" max="10" placeholder="Assignment /10"><input id="su_${s.id}" type="number" min="0" max="60" placeholder="Summative /60"></div>
 <button onclick="saveOneMark('${s.id}','${sid}','${cid}')">SAVE ${esc(s.name)}</button></div>`).join("")||`<div class="notice">No students in this class.</div>`;
}
function saveOneMark(studentId,sid,cid){
 let t=me(),vals=["cw","hw","qt","as"].map(k=>Number(document.getElementById(k+"_"+studentId).value)||0),sum=Number(document.getElementById("su_"+studentId).value)||0;
 if(!assigned(t,sid,cid))return alert("This teacher is not assigned to this subject/class.");
 if(vals.some(v=>v<0||v>10)||sum<0||sum>60)return alert("Check mark limits.");
 let f=vals.reduce((x,y)=>x+y,0),fin=f+sum,term=document.getElementById("et").value;
 let old=data.assessments.find(a=>a.studentId===studentId&&a.subjectId===sid&&a.classId===cid&&a.term===term);
 let obj={id:old?.id||uid("a"),studentId,subjectId:sid,classId:cid,teacherId:t.id,teacherName:t.name,subjectName:byId(data.subjects,sid).name,className:cls(cid),term,classwork:vals[0],homework:vals[1],quiz:vals[2],assignment:vals[3],formative:f,summative:sum,final:fin,grade:grade(fin),remark:remark(fin)};
 if(old)Object.assign(old,obj);else data.assessments.push(obj);save();alert("Assessment saved.");refreshEntry();
}
function tresults(){let t=me();return `<h2>My Results</h2>${table(["Student","Subject","Class","Term","Formative","Summative","Final","Grade","Remark"],assessmentRows(data.assessments.filter(a=>a.teacherId===t.id)))}`}

function backup(){
 return `<h2>Backup / Restore</h2><div class="card"><p>Create a backup of this prototype's data.</p>
 <button onclick="downloadBackup()">DOWNLOAD BACKUP</button>
 <input type="file" id="restoreFile" accept=".json" onchange="restoreBackup(this)">
 <p class="small">This browser prototype stores data locally. For production, backups will be handled by the hosted database.</p></div>`;
}
function downloadBackup(){
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vao-academy-backup.json";a.click();URL.revokeObjectURL(a.href)
}
function restoreBackup(input){
 let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.school||!x.teachers||!x.students)return alert("Invalid VAO Academy backup.");data=x;save();alert("Backup restored.");renderNav();go("dashboard")}catch(e){alert("Could not restore backup.")}};r.readAsText(f)
}
function table(h,r){
 return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(x=>`<td>${x??""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
</script>
</body>
</html>
